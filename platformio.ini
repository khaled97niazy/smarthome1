; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Arduino-ESP32 core 2.0.17 (espressif32@6.9.0) matches camera nodes and stable LEDC/ESP-NOW APIs
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_src_filter = +<main.cpp>
lib_deps =
  madhephaestus/ESP32Servo@^3.2.1

[cam_base]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -Isrc/cam_common
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCAMERA_MODEL_AI_THINKER

[env:cam_face]
extends = cam_base
board_build.partitions = partitions_cam_face.csv
build_src_filter = +<cam_face/> +<cam_common/>

[env:cam_plate]
extends = cam_base
board_build.partitions = huge_app.csv
build_src_filter = +<cam_plate/> +<cam_common/>
build_flags =
  ${cam_base.build_flags}
  -DPLATE_DEFAULT_MODE=0

[env:cam_plate_qr]
extends = env:cam_plate
build_flags =
  ${cam_base.build_flags}
  -DPLATE_DEFAULT_MODE=1
